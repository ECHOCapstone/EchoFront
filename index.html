<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : iOS Safari/PWA 에서 노치/홈 인디케이터 영역까지 콘텐츠가 그려질 수 있게 한다.
         CSS 의 env(safe-area-inset-*) 와 짝지어 BottomNav / 본문 컨테이너의 안전 영역을 보정한다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- 최소 CSP. script 는 self 만 허용하여 외부 스크립트 인젝션을 차단한다.
         connect-src 는 운영 API + 로컬 dev 백엔드 (http://localhost:* / ws://localhost:*) 까지 열어 둔다.
         img-src 의 data:/https: 는 인라인 SVG 와 백엔드가 서빙하는 음소/배지 이미지 호환을 위한 것이다. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; connect-src 'self' https: http://localhost:* ws://localhost:*; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'">
    <title>ECHO</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
